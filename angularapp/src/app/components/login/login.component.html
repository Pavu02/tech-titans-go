<div class="auth-page">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="brand-text">BookHeaven</h1>
        <h2>Welcome back</h2>
        <p>Please enter your details to sign in.</p>
      </div>

      <div *ngIf="errorMessage" class="alert-error">
        {{ errorMessage }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="Enter your email"
            class="form-control"
            [class.input-error]="isSubmitted && loginForm.get('email')?.invalid"
          />
          <div *ngIf="isSubmitted && loginForm.get('email')?.errors as errors" class="error-text">
            <span *ngIf="errors['required']">Email is required</span>
            <span *ngIf="errors['pattern']">Please enter a valid email</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="••••••••"
            class="form-control"
            [class.input-error]="isSubmitted && loginForm.get('password')?.invalid"
          />
          <div *ngIf="isSubmitted && loginForm.get('password')?.errors as errors" class="error-text">
            <span *ngIf="errors['required']">Password is required</span>
            <span *ngIf="errors['minlength']">Password must be at least 6 characters</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-2">Sign In</button>
      </form>

      <div class="auth-footer">
        <p><a routerLink="/forgot-password" class="forgot-link">Forgot Password?</a></p>
        <p>Don't have an account? <a routerLink="/signup">Sign up for free</a></p>
      </div>
    </div>
  </div>
</div>
